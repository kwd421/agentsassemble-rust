# Source files stop at 500 lines. This is an absolute backstop, not a target:
# responsibilities must split as soon as their authority or change reason separates.
#
# Files already above 500 lines when this policy changed are frozen at their exact
# cutover size. They may not grow. When one shrinks, its recorded baseline must
# shrink in the same change, and the entry must disappear once the file reaches
# 500 lines. Never add a new entry: the existing files are deferred debt to split
# after the Rust reimplementation is complete, not exceptions for new work.

[policy]
new_file_line_limit = 500
new_file_byte_limit = 262144
max_logical_line_bytes = 16384

