# Line count is a review signal, never a substitute for responsibility boundaries.
# A 250-line file still splits when concepts or authorities differ. A cohesive
# single flow may remain between 600 and 1,000 lines when splitting would obscure
# its invariant. Files above 1,000 lines fail the gate.

[policy]
warning_line_limit = 500
strong_warning_line_limit = 800
hard_line_limit = 1000
new_file_byte_limit = 262144
max_logical_line_bytes = 16384
