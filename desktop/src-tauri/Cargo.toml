[workspace]

[package]
name = "agentsassemble-desktop"
version = "0.1.0"
description = "Tauri owner for the AgentsAssemble Rust runtime"
edition = "2024"
license = "MIT"

[lib]
name = "agentsassemble_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
agentsassemble-domain = { path = "../../crates/agentsassemble-domain" }
agentsassemble-protocol = { path = "../../crates/agentsassemble-protocol" }
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rfd = "0.17.2"
tauri = { version = "2.11.0", features = [] }
url = "2.5.7"
uuid = { version = "1.24.1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.2", features = ["process", "signal", "user"] }

[target.'cfg(target_os = "macos")'.dependencies]
fs2 = "0.4.3"
same-file = "1.0.6"
tempfile = "3.27.0"
xattr = "1.6.1"

[target.'cfg(windows)'.dependencies]
same-file = "1.0.6"
win32job = "2.0.3"
winapi = { version = "0.3.9", features = ["winnt"] }
windows-acl = "0.3.0"
windows-permissions = "0.2.4"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
winsafe = { version = "0.0.28", features = ["advapi"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
