[workspace]

[package]
name = "agentsassemble-desktop"
version = "0.1.0"
description = "Tauri owner for the AgentsAssemble Rust runtime"
edition = "2024"
license = "MIT"
default-run = "agentsassemble-desktop"

[[bin]]
name = "agentsassemble-runtime-supervisor"
path = "src/supervisor_main.rs"

[lib]
name = "agentsassemble_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
agentsassemble-domain = { path = "../../crates/agentsassemble-domain" }
agentsassemble-protocol = { path = "../../crates/agentsassemble-protocol" }
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
open = "5.4.3"
rfd = "0.17.2"
tauri = { version = "2.12.1", features = [] }
url = "2.5.7"
uuid = { version = "1.24.1", features = ["v4"] }
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2.13.1"
tokio = { version = "1.53.1", features = ["time", "sync"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.2", features = ["process", "signal", "user"] }

[target.'cfg(target_os = "macos")'.dependencies]
fs2 = "0.4.3"
same-file = "1.0.6"
tempfile = "3.27.0"
xattr = "1.6.1"

[target.'cfg(windows)'.dependencies]
same-file = "1.0.6"
win32job = "2.0.3"
winapi = { version = "0.3.9", features = ["winnt"] }
windows-acl = "0.3.0"
windows-permissions = "0.2.4"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
winsafe = { version = "0.0.28", features = ["advapi"] }

[dev-dependencies]
tempfile = "3.27.0"
tauri = { version = "2.12.1", features = ["test"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
