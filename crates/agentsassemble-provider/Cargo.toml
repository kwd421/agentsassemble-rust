[package]
name = "agentsassemble-provider"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agentsassemble-domain = { path = "../agentsassemble-domain" }
chrono.workspace = true
futures-util.workspace = true
fs2.workspace = true
process-wrap = { version = "9.1.0", default-features = false, features = ["job-object", "kill-on-drop", "process-group", "tokio1"] }
serde.workspace = true
serde_json.workspace = true
same-file.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
command-fds.workspace = true
rustix.workspace = true

[target.'cfg(all(unix, not(any(target_os = "linux", target_os = "android"))))'.dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["event"] }
sysinfo.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
