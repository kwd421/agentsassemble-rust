[workspace]
members = [
    "crates/agentsassemble-domain",
    "crates/agentsassemble-persistence",
    "crates/agentsassemble-provider",
    "crates/agentsassemble-protocol",
    "crates/agentsassemble-server",
]
exclude = ["desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive", "env"] }
command-fds = { version = "0.3.3", features = ["tokio"] }
futures-util = "0.3.31"
fs2 = "0.4.3"
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["service", "tokio"] }
hmac = "0.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
regex = "1.12"
rustix = { version = "1.1.4", features = ["process"] }
same-file = "1.0.6"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2.6.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec", "rt"] }
tokio-tungstenite = "0.30.0"
tower-http = { version = "0.7.0", features = ["cors", "fs", "limit", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl", "serde-json-impl", "uuid-impl"] }
unicode-general-category = "1.1.0"
uuid = { version = "1.24.1", features = ["serde", "v4", "v5"] }
url = "2.5.7"
tempfile = "3.27.0"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

# Full executable identities must hash 100+ MiB CLIs inside the validation deadline.
[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
